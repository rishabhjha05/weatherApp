<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&family=Poppins:wght@100;200;300;400;500;600;700;800&family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
      integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <script src="./script.js" defer></script>
    <link rel="stylesheet" href="style.css" />
    <title>Wether App</title>
  </head>
  <body>
    <header>
      <h2>Wether App</h2>
      <i class="fa-brands fa-github"></i>
    </header>
    <div class="card">
      <div class="search-container">
        <div class="input-wraper">
          <input type="text" id="search-input" placeholder="Enter a city" />
        </div>
        <div class="search-icon-wraper">
          <i class="fa-solid fa-magnifying-glass"></i>
        </div>
      </div>
      <div class="weather">
        <img src="./images/clear.png" alt="wether icon" class="weather-icon" />
        <h1 id="temperature"><span>22</span><sup>o</sup>c</h1>
        <h2 id="city-name"></h2>
        <div class="breif-detail">
          <div class="humidity-wraper">
            <img src="./images/humidity.png" alt="humidityico" />
            <div id="humidity">
              <h3></h3>
              <span></span>
            </div>
          </div>
          <div class="wind-wraper">
            <img src="./images/wind.png" alt="windico" />
            <div id="wind">
              <h3></h3>
              <span></span>
            </div>
          </div>
        </div>
      </div>
    </div>
    
  </body>
</html>
